name: Build and Push Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: netdevs-net/holmes-gpt

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holmes-gpt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: holmes-gpt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit types
        run: npx svelte-kit sync

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test:run

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: holmes-gpt
          file: holmes-gpt/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "Built and pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Commit tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }}"

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, kamatera1, holmes-gpt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The host no longer runs swarm (`docker info` reports Swarm: inactive), so
      # the previous `docker service update --force` could not succeed and this job
      # had been failing silently on every run. Deploy with plain compose instead.
      #
      # --project-directory points at the server-only directory holding .env and
      # secrets/anthropic_api_key, which are deliberately not in git; the compose
      # file's relative paths resolve there rather than against the checkout.
      - name: Pull latest image and redeploy
        run: |
          docker compose \
            -f holmes-gpt/docker-compose.yml \
            --project-directory /srv/projects/holmes-gpt \
            pull
          docker compose \
            -f holmes-gpt/docker-compose.yml \
            --project-directory /srv/projects/holmes-gpt \
            up -d

      - name: Verify the new container is serving
        run: |
          sleep 5
          docker compose \
            -f holmes-gpt/docker-compose.yml \
            --project-directory /srv/projects/holmes-gpt \
            ps
          curl -fsS --max-time 10 http://127.0.0.1:5544/api/quotes?limit=1 > /dev/null
          echo "origin responded"
